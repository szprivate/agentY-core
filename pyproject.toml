[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agenty-core"
version = "0.1.0"
description = "Shared ComfyUI/HuggingFace/web/file tool layer for agentY (Strands app) and agentY-mcp (MCP server)."
requires-python = ">=3.10"
# Runtime deps the shared tools/utils need. The consuming app supplies the rest
# (Strands/Ollama for agenty; the MCP SDK for agentY-mcp). Pillow/imageio are
# only needed by the image helpers; kept here so both consumers get them.
dependencies = [
    "requests>=2.31.0",
    "websockets>=12.0",
    "Pillow>=10.0.0",
    "ddgs>=9.0.0",
    "tqdm>=4.66.0",
    # utils/secrets.py imports dotenv at module level — the .env reader every
    # consumer goes through. agentY happened to declare it; agentY-mcp did not.
    "python-dotenv>=1.0.0",
    # utils/image_annotate.py: masks arrive as numpy arrays (SAM3 and friends).
    # A miss here is silent — the mask is dropped and the annotation degrades.
    "numpy>=1.26",
    # utils/video_frames.py's preferred backend (it falls back to OpenCV, then to
    # ffmpeg on PATH). Named in the comment above since day one, never listed.
    #
    # tools/video.py also cuts with the ffmpeg binary this wheel ships, rather
    # than one on PATH: on Windows there usually isn't one, and a shot splitter
    # that depends on the user having installed ffmpeg is a shot splitter that
    # mostly doesn't run.
    "imageio[ffmpeg]>=2.34.0",
    # Shot-boundary detection for tools/video.py. Verified against 0.7.1; the
    # detect()/ContentDetector/AdaptiveDetector API used there is 0.7's.
    "scenedetect>=0.7.0",
    # tools/worldlabs_atlas.py reads the depth EXRs World Labs Atlas returns.
    "OpenEXR>=3.2",
    # partner_credits.py evaluates the JSONata price formulas paid ComfyUI nodes publish.
    "jsonata-python>=0.7.1",
]

[project.optional-dependencies]
# tools/reverse_search.py drives the system Chrome/Edge (no browser download);
# without it the tool answers with a missing_dependency error.
reverse-search = ["playwright>=1.40"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agenty_core*"]
